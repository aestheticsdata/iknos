# Iknos vhost for ks-b — install as /etc/nginx/conf.d/iknos.conf
#
# Same shape as trekker.conf and zeus.conf, which are pfa.conf's shape. The one
# difference that matters is the SSE block: the backend design (§8) says
# "disables buffering on /api/logs/stream so SSE actually streams. That last line
# is the one everyone forgets." It is written here before the route exists,
# precisely so it cannot be forgotten later.
#
#   front  127.0.0.1:3006   (pm2: iknos-web, front range 30xx)
#   api    127.0.0.1:6900   (pm2: iknos-api,  block 6900-6999)
#
# Both slots verified free on ks-b with `ss -ltn` before being taken, and both
# are the last free entries in Zeus's port registry. Register them there.
#
# ============================================================================
# HALF MOCK — the API and the auth screens are live, the console is not.
#
# `/api/*` and `= /health` proxy to the real Nest process on 6900 since
# 2026-08-16 (IKN-6, IKN-21). The four auth screens and `/_next/*` proxy to the
# real Next process on 3006 since 2026-08-17 (IKN-5, first half). `location /`
# still serves the static mock out of /var/www/iknos/public_html, because the
# app chassis and its views do not exist yet (IKN-5, second half).
#
# The three coexist without conflict — see the matching-order note above the
# auth block, which is the only part of this file that is subtle.
#
# When the chassis ships: delete the static block and the auth block, and
# uncomment the catch-all proxy at the bottom. `/_next/` can stay either way.
# ============================================================================

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;

    http2 on;

    server_name iknos.1991computer.com;

    # Its own certificate, not the shared 1991computer.com one — same reasoning
    # as zeus and trekker: a renewal for one site should not put the others in
    # the blast radius.
    #   sudo certbot certonly --webroot -w /var/www/letsencrypt -d iknos.1991computer.com
    ssl_certificate     /etc/letsencrypt/live/iknos.1991computer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iknos.1991computer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Iknos's own access log rather than the shared one. Iknos ingests PM2 logs,
    # not nginx's, so this is for the requests the app never sees: a 503 from
    # limit_req, a probe for /wp-login.php, a 404 on a route that does not exist.
    access_log /var/log/nginx/iknos.access.log combined;

    add_header Alt-Svc 'h3=":443"';
    add_header X-Content-Type-Options nosniff;
    # A monitoring console for one person. Nothing here is ever indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ------------------------------------------------------------------------
    # MOCK PHASE — static mock, no upstream. Delete this whole block when the
    # app chassis ships and `/` becomes the real console.
    # ------------------------------------------------------------------------
    location / {
        root /var/www/iknos/public_html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # The mock is edited and re-rsynced constantly. Caching it is how you
        # spend twenty minutes debugging a change that already shipped.
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # ------------------------------------------------------------------------
    # END MOCK PHASE
    # ------------------------------------------------------------------------

    # ------------------------------------------------------------------------
    # The four auth screens, on the real Next app while `/` is still the mock.
    #
    # A regex location, and the matching order is the whole reason this works:
    # nginx tries `=` first, then `^~` prefixes, then regexes IN ORDER, then the
    # longest plain prefix. So this is reached before `location /` — which is
    # what routes the auth paths away from the mock — and after `^~
    # /api/logs/stream`, which is what keeps SSE out of it. `/api/` is a plain
    # prefix and would lose to a regex, so this pattern deliberately cannot
    # match anything under /api.
    #
    # `(/|$)` and not a bare prefix: without it `/loginsomething` matches too.
    # Next itself is `trailingSlash: true`, so `/login` 308s to `/login/` and
    # both forms have to reach the app.
    # ------------------------------------------------------------------------
    location ~ ^/(login|register|recover|about)(/|$) {
        # Sign-in and recovery are the two routes worth brute-forcing on this
        # box, and they are also the two the API rate-limits per address. This
        # is the cheaper outer bound, applied before a request costs a scrypt
        # derivation.
        limit_req zone=api_zone burst=20 nodelay;
        limit_conn addr 20;

        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The API sets `Secure` on iknos.sid from this header, via Express's
        # trust proxy. Drop it and the cookie comes back without the flag.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # `^~` so it wins outright and no regex is ever tested for an asset request.
    # Hashed filenames, so the year is safe: a new build changes the name.
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------------
    # Live tail (SSE). MUST come before the general /api/ block: nginx picks the
    # longest matching prefix, so `^~` here beats `/api/`. Without proxy_buffering
    # off these events arrive in multi-second bursts, which reads as a dead tail
    # rather than a slow one.
    # ------------------------------------------------------------------------
    location ^~ /api/logs/stream {
        proxy_pass http://127.0.0.1:6900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        limit_conn addr 20;

        proxy_pass http://127.0.0.1:6900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Forwarded-For is what the login rate limiter keys on. Without it
        # every attempt looks like it came from 127.0.0.1 and the limit is
        # global rather than per-client.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:6900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # The console, once it exists. Replaces the MOCK PHASE block above and the
    # auth regex, both of which become redundant the moment `/` is the app.
    # location / {
    #     proxy_pass http://127.0.0.1:3006;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 60s;
    #     proxy_send_timeout 60s;
    #     proxy_buffering off;
    # }
}

server {
    listen 80;
    listen [::]:80;
    server_name iknos.1991computer.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
